<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Journal Editor | Travel Vacation Adventure</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#f3eee3}.editor{max-width:760px;margin:70px auto;background:white;padding:50px;box-shadow:0 20px 70px #10231d18}.editor label{display:block;margin:20px 0 7px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.editor input,.editor textarea{width:100%;padding:14px;border:1px solid #10231d35;font:inherit}.editor textarea{min-height:120px}.editor h1{font:3rem 'DM Serif Display';margin:0}.notice{padding:13px;background:#fff1cf;font-size:.8rem;line-height:1.6;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}#status{margin-top:15px;color:#47685e}@media(max-width:600px){.editor{margin:0;padding:30px 20px}.row{grid-template-columns:1fr}}</style></head><body><main class="editor"><div class="eyebrow">Private publishing tool</div><h1>Add a travel story</h1><p class="notice">This included editor saves posts in this browser for demonstration. For multi-device production publishing, connect the form to your CMS or database.</p><form id="form"><label>Article title</label><input id="title" required><div class="row"><div><label>Category</label><input id="category" required></div><div><label>Publication date</label><input id="date" type="date" required></div></div><label>Short description</label><textarea id="excerpt" required></textarea><label>Featured image URL</label><input id="image" type="url" required><button class="button" style="margin-top:25px">Publish story</button><a href="blog.html" style="margin-left:20px">View journal →</a></form><div id="status"></div></main><script>form.onsubmit=e=>{e.preventDefault();let t=title.value.trim(),saved=JSON.parse(localStorage.getItem('tva_posts')||'[]');saved.unshift({slug:t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),title:t,category:category.value,date:new Date(date.value+'T12:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),excerpt:excerpt.value,image:image.value});localStorage.setItem('tva_posts',JSON.stringify(saved));status.textContent='Story published in this browser. Open the journal to view it.';form.reset()}</script></body></html>
