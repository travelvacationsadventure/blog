<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Editorial Studio | Travel Vacation Adventure</title><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>
:root{--admin:#0b2821;--canvas:#f3f5f1;--border:#dce3df}body{background:var(--canvas);font-family:Manrope}.hidden{display:none!important}.login{width:min(440px,calc(100% - 32px));margin:9vh auto;background:#fff;padding:44px;border-top:5px solid #d8aa60;box-shadow:0 25px 80px #0b28211c}.login h1{font:3rem 'DM Serif Display';margin:8px 0 25px}.field{margin:16px 0}.field label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #ccd7d2;background:white;font:inherit}.field small{color:#7a8882;font-weight:400;text-transform:none;letter-spacing:0}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;background:var(--admin);color:#dce7e2;padding:28px 22px}.sidebar .brand{display:block;margin-bottom:45px}.side-link{display:block;width:100%;padding:13px 14px;margin:6px 0;border:0;background:transparent;color:#b9cac3;text-align:left;font:700 .76rem Manrope;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.side-link.active,.side-link:hover{background:#ffffff12;color:#efc889}.main{margin-left:235px;padding:30px}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topline h1{font:2.6rem 'DM Serif Display';margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.stat{background:#fff;border:1px solid var(--border);padding:20px}.stat b{font:2rem 'DM Serif Display';display:block}.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#75837d}.workspace{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);gap:20px}.panel{background:#fff;border:1px solid var(--border);padding:28px}.panel h2{font:2rem 'DM Serif Display';margin:3px 0 18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;gap:5px;padding:8px;border:1px solid #ccd7d2;border-bottom:0;background:#f5f7f4;flex-wrap:wrap}.tool{min-width:34px;height:32px;border:1px solid #d5ddd9;background:#fff;font-weight:800;cursor:pointer}.tool:hover{background:#e9eee9}.editorbox{min-height:330px;border:1px solid #ccd7d2;padding:18px;font:1rem/1.8 Georgia,serif;outline:none}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:22px}.ghost{padding:11px 14px;border:1px solid #cdd8d2;background:white;cursor:pointer;font-weight:700}.danger{color:#a43125}.status{font-size:.82rem;margin-top:12px}.success{color:#14704d}.error{color:#a43125}.article-tools{display:flex;gap:7px;margin:15px 0}.article-tools input{flex:1;padding:10px;border:1px solid #ccd7d2}.article-list{max-height:610px;overflow:auto}.article{padding:17px 0;border-bottom:1px solid #e1e7e4}.article h3{font:1.2rem 'DM Serif Display';margin:5px 0}.article p{font-size:.72rem;color:#77857f;margin:5px 0 12px}.badge{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;padding:4px 7px;background:#edf1ee}.badge.published{background:#dff3e9;color:#156141}.preview{position:fixed;inset:0;z-index:50;background:#061b16d9;padding:3vh;display:grid;place-items:center}.preview-card{width:min(1000px,100%);height:94vh;background:#fff;position:relative;padding-top:50px}.preview-card iframe{width:100%;height:calc(100% - 50px);border:0}.preview-card>button{position:absolute;right:12px;top:10px}.upload-progress{height:4px;background:#e2e7e4}.upload-progress span{display:block;height:100%;width:0;background:#d8aa60}@media(max-width:980px){.sidebar{position:static;width:100%;display:flex;align-items:center;gap:8px}.sidebar .brand{margin:0 auto 0 0}.side-link{width:auto}.main{margin:0}.workspace{grid-template-columns:1fr}}@media(max-width:650px){.main{padding:18px}.stats,.row{grid-template-columns:1fr}.topline{align-items:flex-start;gap:14px;flex-direction:column}.sidebar{overflow:auto}.sidebar .brand small{display:none}}
</style></head><body><section id="loginPanel" class="login"><div class="eyebrow">Private access</div><h1>Editorial Studio</h1><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="button">Sign in</button><p id="loginStatus" class="status"></p></form></section>
<div id="adminPanel" class="app hidden"><aside class="sidebar"><a class="brand" href="index.html">Travel Vacation Adventure<small>Sri Lanka journal</small></a><button class="side-link active">Dashboard</button><a class="side-link" href="blog.html" target="_blank">Live website ↗</a><button id="logout" class="side-link">Sign out</button></aside><main class="main"><div class="topline"><div><div class="eyebrow">Content management</div><h1>Journal dashboard</h1></div><button id="newArticle" class="button">＋ New article</button></div><section class="stats"><div class="stat"><b id="totalCount">0</b><span>Total articles</span></div><div class="stat"><b id="publishedCount">0</b><span>Published</span></div><div class="stat"><b id="draftCount">0</b><span>Drafts</span></div></section><div class="workspace"><form id="articleForm" class="panel"><input type="hidden" id="articleId"><div class="eyebrow">Editor</div><h2 id="formHeading">Create article</h2><div class="field"><label>Article title <small id="titleCount">0/100</small></label><input id="title" maxlength="100" required></div><div class="row"><div class="field"><label>URL slug</label><input id="slug" pattern="[a-z0-9-]+" required></div><div class="field"><label>Category</label><select id="category"><option>Sri Lanka Guide</option><option>Beaches</option><option>Wildlife</option><option>Culture & Heritage</option><option>Hill Country</option><option>Travel Tips</option><option>Food</option></select></div></div><div class="field"><label>Short excerpt <small id="excerptCount">0/220</small></label><textarea id="excerpt" maxlength="220" style="min-height:90px" required></textarea></div><div class="field"><label>Article body <small>Use the toolbar to format</small></label><div class="toolbar"><button type="button" class="tool" data-cmd="bold" title="Bold">B</button><button type="button" class="tool" data-cmd="italic" title="Italic"><i>I</i></button><button type="button" class="tool" data-block="h2" title="Heading">H2</button><button type="button" class="tool" data-cmd="insertUnorderedList" title="List">• List</button><button type="button" class="tool" data-cmd="justifyLeft" title="Align left">≡</button><button type="button" class="tool" data-cmd="justifyCenter" title="Align center">≡↔</button><button type="button" class="tool" data-cmd="justifyFull" title="Justify">☰</button><button type="button" class="tool" data-cmd="createLink" title="Link">🔗</button><button type="button" class="tool" data-cmd="removeFormat" title="Clear formatting">Tx</button></div><div id="contentEditor" class="editorbox" contenteditable="true"></div></div><div class="field"><label>Featured image</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><input id="imageUrl" type="url" placeholder="Or paste image URL" style="margin-top:8px"><div class="upload-progress"><span id="uploadBar"></span></div></div><div class="row"><div class="field"><label>SEO title <small id="seoCount">0/60</small></label><input id="seoTitle" maxlength="60"></div><div class="field"><label>Meta description <small id="metaCount">0/160</small></label><textarea id="metaDescription" maxlength="160" style="min-height:82px"></textarea></div></div><div class="row"><div class="field"><label>Status</label><select id="articleStatus"><option value="draft">Draft</option><option value="published">Published</option></select></div><div class="field"><label>Publish date</label><input id="publishedAt" type="datetime-local"></div></div><div class="actions"><button id="saveButton" class="button">Save article</button><button type="button" id="previewButton" class="ghost">Preview</button><button type="button" id="cancelEdit" class="ghost hidden">Cancel edit</button></div><p id="saveStatus" class="status"></p></form><aside class="panel"><div class="eyebrow">Content library</div><h2>All articles</h2><div class="article-tools"><input id="searchArticles" type="search" placeholder="Search articles"><select id="filterStatus"><option value="all">All</option><option value="published">Published</option><option value="draft">Draft</option></select></div><div id="articles" class="article-list"><p>Loading…</p></div></aside></div></main></div><div id="previewModal" class="preview hidden"><div class="preview-card"><button id="closePreview" class="ghost">Close preview</button><iframe id="previewFrame" title="Article preview" sandbox="allow-same-origin"></iframe></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="admin.js"></script></body></html>
